# SPDX-License-Identifier: Apache-2.0
name: Engine at opt-level 0
description: >-
  Build lean-ctx-engine and lean-ctx at opt-level 0. Cargo.toml builds them
  at opt-level 1 for Apple's compact-unwind limit, a macOS linker constraint
  only. Elsewhere opt-level 1 roughly triples their compile time (GitLab,
  08.11.: Engine lib 133 s -> 47 s, lean-ctx lib 36 s -> 12 s). Cargo config
  profiles take precedence over Cargo.toml, and a config file (not --config
  flags) also covers cargo runs started from scripts. Jobs that run tests
  set RUST_MIN_STACK, because opt-level 0 frames are larger.
runs:
  using: composite
  steps:
    - name: Write the profile override
      shell: bash
      run: |
        printf '%s\n' '[profile.dev.package.lean-ctx-engine]' 'opt-level = 0' \
          '[profile.dev.package.lean-ctx]' 'opt-level = 0' \
          >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
