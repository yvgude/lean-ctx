# SPDX-License-Identifier: Apache-2.0
name: Set up sccache
description: >-
  Install sccache with the GitHub Actions cache backend and route rustc
  through it. A cache, not a gate: if the download fails, the job compiles
  uncached. SCCACHE_GHA_RW_MODE (workflow env) keeps pull requests read-only.
runs:
  using: composite
  steps:
    - name: Install sccache
      id: install
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
    - name: Enable sccache
      if: steps.install.outcome == 'success'
      shell: bash
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"
