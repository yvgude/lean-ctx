# SPDX-License-Identifier: Apache-2.0
name: Publish SDK

# Publishes the drop-in compress() SDKs (packages/node-lean-ctx -> npm `lean-ctx-sdk`,
# packages/python-lean-ctx -> PyPI `lean-ctx-sdk`). These versions independently of the
# engine, so they are NOT part of release.yml (engine `v*` tags). Trigger manually, or
# push an `sdk-v*` tag. Every step is idempotent: an already-published version is a no-op.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which registries to publish to"
        type: choice
        default: both
        options: [both, npm, pypi]
  push:
    tags:
      - 'sdk-v[0-9]*'

permissions:
  contents: read

jobs:
  ip-provenance-gate:
    name: Publish gates (IP provenance, strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify provenance checker contract
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Strict IP provenance audit
        run: >-
          python3 scripts/ip-provenance-audit.py --root . --release-strict
          --output "$RUNNER_TEMP/ip-provenance-publish-sdk-report.json"
      - name: Upload strict provenance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ip-provenance-publish-sdk-report
          path: ${{ runner.temp }}/ip-provenance-publish-sdk-report.json
          if-no-files-found: ignore

  publish-npm:
    name: Publish lean-ctx-sdk to npm
    needs: ip-provenance-gate
    if: ${{ github.event_name == 'push' || inputs.targets == 'both' || inputs.targets == 'npm' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build, test, publish
        working-directory: packages/node-lean-ctx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "lean-ctx-sdk@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "npm already has lean-ctx-sdk@${PKG_VERSION} — skipping publish."
            exit 0
          fi
          npm publish --access public

  publish-pypi:
    name: Publish lean-ctx-sdk to PyPI
    needs: ip-provenance-gate
    if: ${{ github.event_name == 'push' || inputs.targets == 'both' || inputs.targets == 'pypi' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and upload
        working-directory: packages/python-lean-ctx
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "PYPI_TOKEN secret is required for a selected PyPI publication." >&2
            exit 1
          fi
          python -m pip install --quiet build twine
          python -m build
          python -m twine upload --skip-existing dist/*
