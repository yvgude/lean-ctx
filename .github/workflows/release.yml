name: Release

on:
  push:
    tags:
      # Only true semver release tags (v1.2.3). The digit class deliberately
      # excludes the editor-extension tags (`vscode-v*`), which have their own
      # workflow (publish-vscode.yml) and must NOT trigger a binary release.
      - 'v[0-9]*'

permissions:
  contents: write
  id-token: write

jobs:
  sdk-gate:
    # GL #395: an engine release must never ship while a first-party SDK
    # cannot speak its http_mcp contract version. Minor-version drift across
    # the SDK family surfaces as a warning annotation.
    #
    # Also gates the engine-coupled npm wrapper (lean-ctx-bin):
    # a stale package.json would let the publish step silently skip, shipping a
    # release whose Pi extension / npx wrapper lags the engine.
    name: Release gates (SDK + package versions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Check SDK ↔ engine coupling
        run: python3 scripts/check-sdk-versions.py
      - name: Check npm package ↔ engine version coupling
        run: python3 scripts/check-package-versions.py
      - name: Verify published crate assets
        working-directory: rust
        run: |
          set -euo pipefail
          # The listing must live OUTSIDE the crate directory: the shell
          # creates the redirect target before cargo runs, and cargo package
          # (even --list) fails the VCS dirty-check on the just-created file.
          cargo package --locked --no-verify --list -p lean-ctx > "$RUNNER_TEMP/package-files.txt"
          for asset in \
            assets/ocla/capability-manifests/leanctx/context-optimization-v1.json \
            assets/ocla/capability-manifests/leanctx/passthrough-v1.json \
            assets/ocla/capability-manifests/example/word-count-optimizer-v1.json \
            assets/ocla/capability-manifests/rtk/rtk-shell-v1.json \
            assets/kits/code-review/kit.toml; do
            grep -Fx "$asset" "$RUNNER_TEMP/package-files.txt"
          done

  delivery-gate:
    name: Release gates (tag + delivery evidence)
    needs: sdk-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Verify exact release tag coupling
        run: python3 scripts/check-release-tag.py "${GITHUB_REF_NAME}" --root .
      - name: Verify OCLA contract-pack suite
        run: |
          cargo build --locked --manifest-path clients/rust/lean-ctx-client/Cargo.toml \
            --bin lean-ctx-ocla-verify
          python3 scripts/verify-ocla-contract-suite.py \
            --verifier clients/rust/lean-ctx-client/target/debug/lean-ctx-ocla-verify
      - name: Verify signed delivery manifest contract
        run: |
          python3 scripts/verify-delivery-manifest.py \
            tests/delivery/valid/delivery-manifest.json \
            --root . \
            --trust-root tests/delivery/valid/release-trust-root.json
      - name: Verify delivery evidence contract
        run: |
          python3 scripts/verify-delivery-evidence.py \
            docs/contracts/delivery-evidence-v1.json --root .
      - name: Rehearse hermetic rollback contract
        run: python3 tests/delivery/test_rehearse_delivery.py
      - name: Verify deterministic Python Engine wheel builder
        run: python3 -m unittest tests.delivery.test_python_engine_wheel -v

  build:
    name: Build ${{ matrix.artifact || matrix.target }}
    needs: delivery-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            wheel_distribution: thinkery-leanctx-engine
            wheel_platform: manylinux_2_35_x86_64
          - target: x86_64-unknown-linux-gnu
            artifact: x86_64-unknown-linux-gnu-cuda
            os: ubuntu-22.04
            cargo_features: ort-cuda
            wheel_distribution: thinkery-leanctx-engine-cuda
            wheel_platform: manylinux_2_35_x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            wheel_distribution: thinkery-leanctx-engine
            wheel_platform: manylinux_2_35_aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            musl: true
            wheel_distribution: thinkery-leanctx-engine
            wheel_platform: musllinux_1_2_x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            musl: true
            wheel_distribution: thinkery-leanctx-engine
            wheel_platform: musllinux_1_2_aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            macos_deployment_target: "11.0"
            wheel_distribution: thinkery-leanctx-engine
            wheel_platform: macosx_11_0_x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            macos_deployment_target: "11.0"
            wheel_distribution: thinkery-leanctx-engine
            wheel_platform: macosx_11_0_arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            wheel_distribution: thinkery-leanctx-engine
            wheel_platform: win_amd64
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            jemalloc: true
            wheel_distribution: thinkery-leanctx-engine-windows-gnu
            wheel_platform: win_amd64

    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      - name: Check out certified Agent Tools SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Thinkery-AG/leanctx-sdk
          ref: ea7c4a357b592465f498670f2e7579d1f10bc1ca
          path: sdk-agent-tools
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install musl tools
        if: matrix.musl == true && matrix.zig != true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            test "$(uname -m)" = "aarch64"
            command -v musl-gcc
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
            echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
            echo "AR_aarch64_unknown_linux_musl=ar" >> "$GITHUB_ENV"
            echo "RANLIB_aarch64_unknown_linux_musl=ranlib" >> "$GITHUB_ENV"
          fi

      - name: Install cross-compilation tools
        if: matrix.cross == true && matrix.musl != true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # ---- Windows jemalloc target: MSYS2 + pre-built jemalloc ------------
      # See .github/actions/windows-jemalloc for the pitfall details.
      - name: Setup MSYS2 and MinGW
        if: matrix.jemalloc == true
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW64
          update: true
          install: base-devel mingw-w64-x86_64-toolchain
          path-type: inherit

      - name: Build jemalloc (Windows GNU target)
        if: matrix.jemalloc == true
        id: jemalloc
        uses: ./.github/actions/windows-jemalloc

      - name: Run tests
        if: matrix.cross != true
        working-directory: rust
        shell: bash
        run: |
          if [[ "${{ matrix.jemalloc }}" == "true" ]]; then
            JEMALLOC_OVERRIDE="${{ steps.jemalloc.outputs.jemalloc-override }}" \
              CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-L ${{ steps.jemalloc.outputs.dummy-dir }}" \
              cargo test --lib --target x86_64-pc-windows-gnu --all-features --locked -- --test-threads=1
          else
            cargo test --lib --all-features --locked -- --test-threads=1
          fi

      - name: Setup Zig
        if: matrix.zig == true
        run: |
          pip3 install -q ziglang==0.13.0
          ZIG_BIN="$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')"
          echo "${ZIG_BIN}" >> $GITHUB_PATH
          "${ZIG_BIN}/zig" version

      - name: Install cargo-zigbuild
        if: matrix.zig == true
        uses: taiki-e/install-action@74e87cbfa15a59692b158178d8905a61bf6fca95 # v2
        with:
          # Pinned: rustc 1.98 injects --fix-cortex-a53-843419 for aarch64,
          # which zig's lld rejects; cargo-zigbuild 0.23.x filters it. The
          # action's manifest at the pinned commit resolves to 0.21.4 otherwise.
          tool: cargo-zigbuild@0.23.2

      # Ship the production feature set (Cargo default features incl. secure-update),
      # NOT --all-features — the latter would pull dev-only tooling (dev-tools:
      # gen_docs/gen_mcp_manifest) into the released binary. Default features are
      # already exercised by the CI test job (which runs the --all-features superset).
      # --locked pins Cargo.lock so releases are reproducible (no silent dep drift).
      - name: Build
        working-directory: rust
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          features="${{ matrix.cargo_features }}"
          feature_args=()
          if [[ -n "$features" ]]; then
            feature_args+=(--features "$features")
          fi
          if [[ "${{ matrix.zig }}" == "true" ]]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} "${feature_args[@]}"
          elif [[ "${{ matrix.jemalloc }}" == "true" ]]; then
            JEMALLOC_OVERRIDE="${{ steps.jemalloc.outputs.jemalloc-override }}" \
              CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-L ${{ steps.jemalloc.outputs.dummy-dir }}" \
              cargo build --release --locked --target ${{ matrix.target }} "${feature_args[@]}"
          else
            cargo build --release --locked --target ${{ matrix.target }} "${feature_args[@]}"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          artifact="${{ matrix.artifact || matrix.target }}"
          cd rust/target/${{ matrix.target }}/release
          tar czf ../../../../lean-ctx-${artifact}.tar.gz lean-ctx
          cd ../../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "rust/target/${{ matrix.target }}/release/lean-ctx.exe" -DestinationPath "lean-ctx-${{ matrix.artifact || matrix.target }}.zip"

      - name: Build Python Engine companion wheel
        shell: bash
        run: |
          binary="rust/target/${{ matrix.target }}/release/lean-ctx"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          python scripts/build-python-engine-wheel.py \
            --binary "$binary" \
            --distribution "${{ matrix.wheel_distribution }}" \
            --version "${GITHUB_REF_NAME#v}" \
            --platform-tag "${{ matrix.wheel_platform }}" \
            --output-dir dist-engine-wheels

      - name: Verify native companion wheel and Agent Tools protocol
        shell: bash
        run: |
          wheel=$(find dist-engine-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m venv wheel-smoke
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            wheel_python="wheel-smoke/Scripts/python.exe"
            wheel_engine="wheel-smoke/Scripts/lean-ctx.exe"
          else
            wheel_python="wheel-smoke/bin/python"
            wheel_engine="wheel-smoke/bin/lean-ctx"
          fi
          if [[ "${{ matrix.musl }}" == "true" ]]; then
            "$wheel_python" -m pip install --no-deps \
              --target wheel-smoke/site \
              --platform "${{ matrix.wheel_platform }}" \
              --python-version 3 --implementation py --abi none \
              --only-binary=:all: "$wheel"
            wheel_engine=$(find wheel-smoke/site -mindepth 3 -maxdepth 3 \
              -path '*/bin/lean-ctx' -type f -print -quit)
            test -n "$wheel_engine"
          else
            "$wheel_python" -m pip install --no-deps "$wheel"
          fi
          "$wheel_python" -m pip install --quiet 'twine==7.0.0'
          "$wheel_python" -m twine check --strict "$wheel"
          test "$("$wheel_engine" --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
          PYTHONPATH=sdk-agent-tools/src "$wheel_python" \
            sdk-agent-tools/scripts/verify_agent_context_e2e.py \
            --engine "$wheel_engine" \
            --expected-engine-version "${GITHUB_REF_NAME#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-ctx-${{ matrix.artifact || matrix.target }}
          path: |
            lean-ctx-${{ matrix.artifact || matrix.target }}.tar.gz
            lean-ctx-${{ matrix.artifact || matrix.target }}.zip
            dist-engine-wheels/*.whl

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Collect companion wheels
        run: |
          find . -mindepth 2 -type f -name 'thinkery_leanctx_engine*.whl' -exec mv -t . {} +
          test "$(find . -maxdepth 1 -type f -name 'thinkery_leanctx_engine*.whl' | wc -l)" -eq 9

      - name: Create stable source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="lean-ctx-${VERSION}/" "${GITHUB_REF_NAME}" -o "lean-ctx-${VERSION}-source.tar.gz"

      - name: Generate checksums
        run: sha256sum lean-ctx-*.tar.gz lean-ctx-*.zip thinkery_leanctx_engine*.whl > SHA256SUMS

      - name: Sign release artifacts with cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Cosign sign SHA256SUMS
        run: |
          cosign sign-blob --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Generate SBOM
        run: |
          cd rust
          cargo tree --locked --prefix none --no-dedupe \
            --format "{p} {l}" > ../SBOM.txt
          cd ..
          echo "SBOM generated with $(wc -l < SBOM.txt) entries"

      - name: Generate release manifest
        run: |
          python3 -c "
          import json, hashlib, datetime, pathlib
          artifacts = {}
          release_files = [*pathlib.Path('.').glob('lean-ctx-*'),
                           *pathlib.Path('.').glob('thinkery_leanctx_engine*.whl')]
          for f in sorted(release_files):
              h = hashlib.sha256(f.read_bytes()).hexdigest()
              artifacts[f.name] = {'sha256': h, 'size': f.stat().st_size}
          sbom_h = hashlib.sha256(pathlib.Path('SBOM.txt').read_bytes()).hexdigest()
          manifest = {
              'schema_version': 'leanctx.release-manifest/v1',
              'tag': '${{ github.ref_name }}',
              'commit': '${{ github.sha }}',
              'timestamp': datetime.datetime.utcnow().isoformat() + 'Z',
              'artifacts': artifacts,
              'sbom_sha256': sbom_h,
              'checksums_sha256': hashlib.sha256(
                  pathlib.Path('SHA256SUMS').read_bytes()).hexdigest()
          }
          pathlib.Path('release-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          "

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^v${VERSION}$" | tail -1)
          NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)

          {
            echo "body<<BODY_EOF"
            echo "$NOTES"
            echo ""
            echo "#### Upgrade"
            echo '```bash'
            echo "lean-ctx update                 # recommended (auto-downloads + refreshes shell hooks)"
            echo "cargo install lean-ctx          # or"
            echo "npm update -g lean-ctx-bin      # or"
            echo "brew upgrade lean-ctx"
            echo '```'
            echo ""
            echo "> **Note:** After upgrading via cargo/npm/brew, run \`lean-ctx setup\` to refresh shell aliases. \`lean-ctx update\` does this automatically."
            echo ""
            echo "**Full Changelog**: https://github.com/yvgude/lean-ctx/compare/${PREV_TAG}...v${VERSION}"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            lean-ctx-*.tar.gz
            lean-ctx-*.zip
            thinkery_leanctx_engine*.whl
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
            SBOM.txt
            release-manifest.json

  jetbrains-plugin:
    # Build the JetBrains/IntelliJ plugin and attach it to the GitHub Release as a
    # Disabled: packages/jetbrains-lean-ctx archived (2026-08-20)
    if: false
    # downloadable .zip (#418). The plugin's own workflow only runs on plugin source
    # changes; the GITHUB_TOKEN-created release here does not trigger other workflows,
    # so the asset must be produced from inside this release pipeline. `-Pversion`
    # mirrors the tag so the plugin version never drifts from the engine release.
    name: Attach JetBrains Plugin
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build plugin distribution
        working-directory: packages/jetbrains-lean-ctx
        run: ./gradlew buildPlugin -Pversion="${GITHUB_REF_NAME#v}" --console=plain

      - name: Attach plugin ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        # Gradle's rootProject.name is "lean-ctx", so buildPlugin emits
        # build/distributions/lean-ctx-<version>.zip — indistinguishable from a
        # source archive in the release asset list, which is why the plugin
        # looked "missing" (#418). Re-name it to a discoverable, unambiguous
        # asset before upload so users can actually find the JetBrains plugin.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="$(ls packages/jetbrains-lean-ctx/build/distributions/*.zip | head -1)"
          if [ -z "$SRC" ]; then
            echo "::error::No plugin distribution zip produced by buildPlugin" >&2
            exit 1
          fi
          DEST="lean-ctx-jetbrains-plugin-${VERSION}.zip"
          cp "$SRC" "$DEST"
          gh release upload "${GITHUB_REF_NAME}" "$DEST" --clobber

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Fail the release if publishing fails — a silent skip used to ship a GitHub
      # release whose crates.io artifact was missing. Re-runs are idempotent: an
      # already-published version is treated as a no-op, not a failure.
      - name: Publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if curl -fsSL -H "User-Agent: lean-ctx-release" \
               "https://crates.io/api/v1/crates/lean-ctx/${CRATE_VERSION}" >/dev/null 2>&1; then
            echo "crates.io already has lean-ctx ${CRATE_VERSION} — skipping publish."
            exit 0
          fi
          # Publish the dependency graph from leaves to the engine.
          PROTO_VERSION="$(grep -m1 '^version' crates/lean-ctx-protocol/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if ! curl -fsSL -H "User-Agent: lean-ctx-release" \
               "https://crates.io/api/v1/crates/lean-ctx-protocol/${PROTO_VERSION}" >/dev/null 2>&1; then
            echo "Publishing lean-ctx-protocol ${PROTO_VERSION} to crates.io first..."
            cargo publish --allow-dirty --token "${CARGO_REGISTRY_TOKEN}" -p lean-ctx-protocol
            echo "Waiting 30s for crates.io index propagation..."
            sleep 30
          fi
          OCLA_VERSION="$(grep -m1 '^version' crates/lean-ctx-ocla/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if ! curl -fsSL -H "User-Agent: lean-ctx-release" \
               "https://crates.io/api/v1/crates/lean-ctx-ocla/${OCLA_VERSION}" >/dev/null 2>&1; then
            echo "Publishing lean-ctx-ocla ${OCLA_VERSION} to crates.io..."
            cargo publish --allow-dirty --token "${CARGO_REGISTRY_TOKEN}" -p lean-ctx-ocla
            echo "Waiting 30s for crates.io index propagation..."
            sleep 30
          fi
          # `cargo package` verifies the engine from its packaged source after
          # its published protocol dependencies are available and local
          # `[patch.crates-io]` entries have been stripped. This must pass
          # before we promise that `cargo install lean-ctx` works.
          cargo package --locked -p lean-ctx
          # Verification is intentionally mandatory: source packages cannot rely
          # on this repository's local `[patch.crates-io]` entries.
          cargo publish --allow-dirty --token "${CARGO_REGISTRY_TOKEN}"

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC): authenticates via short-lived OIDC token
      # from GitHub Actions. No NPM_TOKEN secret needed. Requires per-package
      # trusted publisher config on npmjs.com (org=yvgude, repo=lean-ctx,
      # workflow=release.yml). NODE_AUTH_TOKEN must NOT be set or npm falls back
      # to the legacy token path. See: https://docs.npmjs.com/trusted-publishers/
      #
      # Idempotent: an already-published version is a no-op, not a failure.
      - name: Publish lean-ctx-bin
        working-directory: packages/lean-ctx-bin
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "lean-ctx-bin@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "npm already has lean-ctx-bin@${PKG_VERSION} — skipping publish."
            exit 0
          fi
          npm publish --access public

      - name: Publish pi-lean-ctx
        working-directory: packages/pi-lean-ctx
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "pi-lean-ctx@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "npm already has pi-lean-ctx@${PKG_VERSION} — skipping publish."
            exit 0
          fi
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm publish --access public

  publish-python-engine:
    name: Publish Python Engine wheels
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download signed-release companion wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --pattern 'thinkery_leanctx_engine*.whl'
          --dir dist
      - name: Publish exact Engine companions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  update-homebrew:
    name: Update Homebrew
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums and extract platform hashes
        id: checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          gh release download "${GITHUB_REF_NAME}" \
            --repo yvgude/lean-ctx --pattern "SHA256SUMS" --dir .

          AARCH64_DARWIN=$(grep "aarch64-apple-darwin\.tar\.gz" SHA256SUMS | awk '{print $1}')
          X86_64_DARWIN=$(grep "x86_64-apple-darwin\.tar\.gz" SHA256SUMS | awk '{print $1}')
          AARCH64_LINUX_GNU=$(grep "aarch64-unknown-linux-gnu\.tar\.gz" SHA256SUMS | awk '{print $1}')
          X86_64_LINUX_GNU=$(grep "x86_64-unknown-linux-gnu\.tar\.gz" SHA256SUMS | awk '{print $1}')

          echo "aarch64_darwin_sha=${AARCH64_DARWIN}" >> "$GITHUB_OUTPUT"
          echo "x86_64_darwin_sha=${X86_64_DARWIN}" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux_sha=${AARCH64_LINUX_GNU}" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux_sha=${X86_64_LINUX_GNU}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clone and generate binary formula
        run: |
          VERSION="${{ steps.checksums.outputs.version }}"
          AARCH64_DARWIN_SHA="${{ steps.checksums.outputs.aarch64_darwin_sha }}"
          X86_64_DARWIN_SHA="${{ steps.checksums.outputs.x86_64_darwin_sha }}"
          AARCH64_LINUX_SHA="${{ steps.checksums.outputs.aarch64_linux_sha }}"
          X86_64_LINUX_SHA="${{ steps.checksums.outputs.x86_64_linux_sha }}"

          git clone "https://x-access-token:${HOMEBREW_TOKEN}@github.com/yvgude/homebrew-lean-ctx.git"
          cd homebrew-lean-ctx

          cat > Formula/lean-ctx.rb <<EOF
          class LeanCtx < Formula
            desc "The Context Engineering Layer for AI Coding — 71 MCP tools, 10 read modes, 95+ shell patterns"
            homepage "https://leanctx.com"
            version "${VERSION}"
            license "Apache-2.0"

            # Semantic search (ctx_semantic_search / embeddings) loads
            # libonnxruntime at runtime; the engine resolves it from the
            # Homebrew prefix lib dir. Without this dependency the dylib is
            # absent and ORT init fails. See issue #544.
            depends_on "onnxruntime"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/yvgude/lean-ctx/releases/download/v${VERSION}/lean-ctx-aarch64-apple-darwin.tar.gz"
                sha256 "${AARCH64_DARWIN_SHA}"
              else
                url "https://github.com/yvgude/lean-ctx/releases/download/v${VERSION}/lean-ctx-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_64_DARWIN_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/yvgude/lean-ctx/releases/download/v${VERSION}/lean-ctx-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${AARCH64_LINUX_SHA}"
              else
                url "https://github.com/yvgude/lean-ctx/releases/download/v${VERSION}/lean-ctx-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_64_LINUX_SHA}"
              end
            end

            def install
              bin.install "lean-ctx"
            end

            test do
              assert_match "lean-ctx ${VERSION}", shell_output("#{bin}/lean-ctx --version")
            end
          end
          EOF
          sed -i 's/^          //' Formula/lean-ctx.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lean-ctx.rb
          git diff --cached --quiet || git commit -m "lean-ctx ${VERSION}"
          git push
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}

  announce-twitter:
    name: Announce on Twitter
    needs: [release, publish-crates, publish-npm, publish-python-engine, update-homebrew]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Post release tweet
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/post-release-tweet.mjs

  announce-discord:
    name: Announce on Discord
    needs: [release, publish-crates, publish-npm, publish-python-engine, update-homebrew]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord via n8n webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"published\",\"release\":{\"tag_name\":\"${RELEASE_TAG}\",\"html_url\":\"https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}\"}}"
