name: Windows signing verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Sign and verify ${{ matrix.target }}
    runs-on: windows-2025
    timeout-minutes: 90
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            distribution: thinkery-leanctx-engine
          - target: x86_64-pc-windows-gnu
            distribution: thinkery-leanctx-engine-windows-gnu
            jemalloc: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Setup MSYS2 and MinGW
        if: matrix.jemalloc == true
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: MINGW64
          update: true
          install: base-devel mingw-w64-x86_64-toolchain
          path-type: inherit
      - name: Build jemalloc
        if: matrix.jemalloc == true
        id: jemalloc
        uses: ./.github/actions/windows-jemalloc
      - name: Build production engine
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.jemalloc }}" == "true" ]]; then
            JEMALLOC_OVERRIDE="${{ steps.jemalloc.outputs.jemalloc-override }}" \
              CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-L ${{ steps.jemalloc.outputs.dummy-dir }}" \
              cargo build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Reject unsigned binary
        shell: pwsh
        run: |
          $rejected = $false
          try { ./scripts/verify-windows-signature.ps1 -Path "rust/target/${{ matrix.target }}/release/lean-ctx.exe" }
          catch { $rejected = $true }
          if (-not $rejected) { throw 'Unsigned binary was incorrectly accepted' }
      - name: Sign Windows engine
        uses: ./.github/actions/windows-signing
        with:
          binary: rust/target/${{ matrix.target }}/release/lean-ctx.exe
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reject tampered signature
        shell: pwsh
        run: |
          $tampered = Join-Path $env:RUNNER_TEMP 'tampered-lean-ctx.exe'
          Copy-Item "rust/target/${{ matrix.target }}/release/lean-ctx.exe" $tampered
          $stream = [System.IO.File]::Open($tampered, 'Open', 'ReadWrite')
          try {
            $stream.Position = 4096
            $original = $stream.ReadByte()
            if ($original -lt 0) { throw 'Engine is unexpectedly short' }
            $stream.Position = 4096
            $stream.WriteByte($original -bxor 1)
          } finally { $stream.Dispose() }
          $rejected = $false
          try { ./scripts/verify-windows-signature.ps1 -Path $tampered }
          catch { $rejected = $true }
          Remove-Item $tampered
          if (-not $rejected) { throw 'Tampered binary was incorrectly accepted' }
      - name: Verify engine runs and package signed bytes
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "rust/target/$env:TARGET/release/lean-ctx.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'Signed binary failed to run' }
          $version = python -c "import tomllib; print(tomllib.load(open('rust/Cargo.toml', 'rb'))['package']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Version lookup failed' }
          New-Item -ItemType Directory -Force signed-artifacts | Out-Null
          Compress-Archive -LiteralPath $binary -DestinationPath "signed-artifacts/lean-ctx-$env:TARGET.zip"
          python scripts/build-python-engine-wheel.py --binary $binary --distribution $env:DISTRIBUTION --version $version --platform-tag win_amd64 --output-dir signed-artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $archives = @(Get-ChildItem signed-artifacts -File | ForEach-Object FullName)
          python scripts/verify-windows-packages.py --binary $binary @archives
          if ($LASTEXITCODE -ne 0) { throw 'Packaged signature bytes differ' }
          Get-FileHash signed-artifacts/* -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content signed-artifacts/SHA256.txt
      - name: Upload signed verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.target }}
          path: signed-artifacts/
          if-no-files-found: error
          retention-days: 14
