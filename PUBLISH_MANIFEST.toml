# CANDIDATE: the include list is the top level of the published tree at public
# main bc5ba30125d7 (3.11.4 line + #2099–#2111); baseline moved to public main
# 10a74ea6e722 (#2123–#2152) for the 3.12.0 release. Directory-wide includes alone would admit any new file
# placed in an included directory; `baseline_commit` closes that: a selected
# path that the published tree does not have is refused until it is named in
# `new_paths` — after its provenance and licence evidence were reviewed.
