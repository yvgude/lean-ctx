# Positive selection of the public Community tree (scripts/public-export.py).
#
# A path is published only when `include` names it. `exclude` removes private
# files that live inside an included directory. `forbidden_prefixes` is a
# second, independent check: selecting or exporting anything below one of them
# is an error, not a silent omission.
#
# This file selects paths; it grants no licence. Classification stays with
# LICENSE_MATRIX.toml and scripts/ip-provenance-audit.py, run on the export.
