          \( -type d -o -type f \) -writable -print -quit)"
        if test -n "$writable_source"; then echo "CI source remains writable" >&2; exit 1; fi
        git config --global --add safe.directory "$CI_PROJECT_DIR"
        git -C "$CI_PROJECT_DIR" rev-parse HEAD | tee "$CI_PROJECT_DIR/runtime-evidence/commit.txt"
        rustc +stable --version --verbose | tee "$CI_PROJECT_DIR/runtime-evidence/toolchain.txt"
        echo "${SCCACHE_DIR:-off} ${SCCACHE_LOCAL_RW_MODE:-}" | tee "$CI_PROJECT_DIR/runtime-evidence/sccache.txt"
        cd "$CI_PROJECT_DIR/rust"
        cargo +stable fmt --all --check 2>&1 | tee "$CI_PROJECT_DIR/runtime-evidence/fmt.log"
        cargo +stable clippy --locked --all-features -- -D warnings 2>&1 | tee "$CI_PROJECT_DIR/runtime-evidence/clippy.log"
        # Stopping the server flushes pending cache writes and prints its stats.
        if test -n "${RUSTC_WRAPPER:-}"; then sccache --stop-server 2>&1 | tee -a "$CI_PROJECT_DIR/runtime-evidence/sccache.txt"; fi
        GIT_OPTIONAL_LOCKS=0 git -C "$CI_PROJECT_DIR" diff --exit-code HEAD --
      '

v4-provenance:
  stage: verify
  image:
    name: lean-ctx-ci-rust:65e3bbf776c5
    pull_policy: if-not-present
  # Python checks plus `cargo fetch`, no compilation: small runner (see
  # ip-boundary-skill-installed).
  tags: [light]
  timeout: 15 minutes
  interruptible: false
  rules:
    - !reference [.interruptible-on-mr, rules]
  needs: []
  # `cargo fetch` below downloaded every crate from crates.io on each run
  # (measured 09.11.: 7-11 s). Read the crates v4-runtime already keeps in the
  # shared cache instead (same key, pull only, so this job never writes it);
  # only crates missing from it are downloaded. git clean removes the
  # directory again before the next job.
  cache:
    - key:
        prefix: "v4-cargohome-${CI_PROJECT_ID}-v4-runtime-rust1.99.1"
        files:
          - rust/Cargo.lock
      fallback_keys:
        - "v4-cargohome-${CI_PROJECT_ID}-v4-runtime-rust1.99.1-tip"
      paths:
        - rust/target/ci-cargo-home/registry/index/
        - rust/target/ci-cargo-home/registry/cache/
        - rust/target/ci-cargo-home/git/db/
      policy: pull
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/rust/target/ci-cargo-home"
  before_script:
    - git fetch origin refs/heads/cla-signatures:refs/remotes/origin/cla-signatures
    - cargo fetch --locked --manifest-path rust/Cargo.toml
  script:
    - test "$(git rev-parse --is-shallow-repository)" = "false"
    - python3 -m unittest discover -s scripts/tests -v
    - python3 scripts/verify-team-context-v1.py
    - python3 scripts/verify-team-seat-value-v1.py
    - python3 scripts/verify-team-seat-value-rust-parity.py
    - python3 scripts/verify-delivery-evidence.py docs/contracts/delivery-evidence-v1.json --root .
    - python3 scripts/check-local-free.py --root .
    - python3 -m unittest tests/delivery/test_check_local_free.py
    - python3 scripts/generate-third-party-notices.py --root . --check
    - |
      # The audit describes the public tree. The private mirror also carries
      # parts the publish manifest never selects (ee/, sdk/, agent skills), so
      # there it audits the positive public export of HEAD, as the release gate
      # (publish-gate R03, ee/delivery/tools/r05-export-build.sh) does.
      if test -d ee; then
        export_dir="$(mktemp -d)/tree"
        python3 scripts/public-export.py export --repo . --source-commit "$(git rev-parse HEAD)" --manifest PUBLISH_MANIFEST.toml --out "$export_dir"
        rm -f "$export_dir/PUBLIC-EXPORT-RECEIPT.json"
        git -C "$export_dir" init -q
        git -C "$export_dir" -c user.name=export -c user.email=export@localhost add -A
        git -C "$export_dir" -c user.name=export -c user.email=export@localhost commit -q -m "public export"
        (cd "$export_dir" && python3 scripts/ip-provenance-audit.py --root . --export --output "$CI_PROJECT_DIR/ip-provenance-gitlab-report.json")
      else
        python3 scripts/ip-provenance-audit.py --root . --output ip-provenance-gitlab-report.json
      fi
    - python3 scripts/history-policy-gate.py gate --root . --policy security/history-policy-v1.json --output history-delta-gitlab-report.json
    - if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then git diff --check "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD; else git diff --check HEAD^ HEAD; fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ip-provenance-gitlab-report.json
      - history-delta-gitlab-report.json
