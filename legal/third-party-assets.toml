license_text_path = "rust/crates/vendor/oauth2/LICENSE-MIT"
modified = true
modification_summary = "LeanCTX replaces the chrono dependency (RUSTSEC-2026-0543, unmaintained) with lean-ctx-time: Cargo.toml swaps the chrono dependency for the in-tree lean-ctx-time crate; src/introspection.rs uses lean_ctx_time::UtcDateTime for exp/iat/nbf and adds a private ts_seconds_option serde module mirroring chrono 0.4.45's (integer Unix seconds on the wire, same error texts; instants outside jiff's range -009999-01-02T01:59:59Z..=9999-12-30T22:00:00Z, which chrono accepted, are rejected) plus a wire-format test; src/devicecode.rs uses UtcDateTime for the polling clock (set_time_fn, timeout) and lean_ctx_time::Duration for the timeout conversion. Each change is marked with a LeanCTX comment. Every .rs file carries an SPDX NOASSERTION header line. The package is upstream oauth2 5.0.0 (git f3424b4b2190c83c6d031fdc71eed2351d49e0df) from crates.io; Cargo.toml is upstream Cargo.toml.orig, and the registry Cargo.toml, lock files, .github and VCS metadata are not kept."
evidence_paths = [
  "rust/crates/vendor/oauth2/Cargo.toml",
  "rust/crates/vendor/oauth2/LICENSE-MIT",
  "rust/crates/vendor/oauth2/LICENSE-APACHE",
  "rust/crates/vendor/oauth2/src/introspection.rs",
  "rust/crates/vendor/oauth2/src/devicecode.rs",
  "rust/Cargo.toml",
]

