modification_summary = "LeanCTX carries two local patches described in rust/Cargo.toml: a one-shot transport releases its service even when the caller has disconnected (src/transport.rs), and a request without inline lifecycle metadata before initialize is handed back to the caller, which answers -32601 (#1454, src/service/server.rs). It adds regression tests for #1454 (tests/test_stateless_server_requests.rs) and the OAuth discovery status-page case (#1391, src/transport/auth.rs), and SPDX NOASSERTION header lines on the source files that are new since the provenance cut; upstream rmcp 3.9.0 is retained as the provenance base."
