# Local-free invariant v2 (docs/contracts/local-free-invariant-v2.md):
# files outside rust/src/core/hive/ that still contain a gating symbol
# (entitlement, plan, licence or billing-capability checks) in their code.
# scripts/check-local-free.py fails on any other file with a hit and on an entry
# whose file no longer has one, so this list only shrinks. Owner: the Hive
# strand that removes the check or moves it into core/hive (B engine cleanup,
# C Hive connector). Exit at G1: empty, except core/billing/plans.rs if the
# plan catalog is kept as data.
schema = "leanctx.local-free-allowlist/v1"

