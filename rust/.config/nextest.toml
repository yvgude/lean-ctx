# cargo-nextest configuration (workspace root: rust/).
#
# Agents: cargo nextest run -p lean-ctx-engine --lib --locked
# CI:     cargo nextest run --profile ci ...
#
# Why nextest for the lib suites: nearly every engine test takes a process-global
# test lock (test_env_lock / isolated_data_dir, #[serial], TestPolicyOverride),
# so libtest threads queue behind each other (engine lib: ~708 s wall, < 1 core).
# nextest runs one process per test, so those in-process locks only serialize
# within a test (engine lib: ~150 s). The integration binaries are a different
# trade-off (see .github/workflows/ci.yml, #1206).
experimental = ["wrapper-scripts"]

[profile.default]
# Leave headroom on shared build hosts; override with --test-threads.
test-threads = -4
# Flakes must surface, not be masked: no profile retries.
retries = 0
# Report a test after 60 s, kill it after 5 periods (300 s). The slowest
# engine test today is core::cache::tests::concurrent_cache_hits_are_lossless
# (130-175 s at 16 threads: 16k durable event appends); it alone sets the
# suite's wall time.
slow-timeout = { period = "60s", terminate-after = 5 }
leak-timeout = "500ms"
fail-fast = false

[scripts.wrapper.data-dir]
command = { command-line = ".config/nextest-data-dir.sh", relative-to = "workspace-root" }

# The same wrapper for Windows hosts (GitHub's Windows job), as a batch file.
[scripts.wrapper.data-dir-windows]
command = { command-line = ".config/nextest-data-dir.cmd", relative-to = "workspace-root" }

# One empty LEAN_CTX_DATA_DIR per test process (see nextest-data-dir.sh/.cmd).
[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
run-wrapper = 'data-dir'

[[profile.default.scripts]]
platform = 'cfg(windows)'
filter = 'all()'
run-wrapper = 'data-dir-windows'

# Tests that share state outside the per-test data dir (fixed ports, fixed
# paths, cross-test ordering) go into a max-threads = 1 group here:
#   [test-groups]
#   serial-external = { max-threads = 1 }
#   [[profile.default.overrides]]
#   filter = 'test(/^suite::name::/)'
#   test-group = 'serial-external'
# The lean-ctx-server integration binaries below keep `#[serial]` tests on one
# fixed temp directory; one process per test would race on it.
[test-groups]
serial-external = { max-threads = 1 }

# Matches both layouts: one binary per file, or modules of the crate's merged
# tests/main.rs.
[[profile.default.overrides]]
filter = 'package(lean-ctx-server) & (binary(workflow_done_scenarios) | binary(bazsi_reported_scenarios) | (binary(main) & test(/^(workflow_done_scenarios|bazsi_reported_scenarios)::/)))'
test-group = 'serial-external'

# CI (ci/gitlab-ci.yml v4-runtime and mr-quick; GitHub CI). Owner 08.11.:
# one process per test on every CPU the job's cgroup grants (the job caps
# CPUs, CARGO_BUILD_JOBS caps the compile), every failure reported, no retry
# that could hide a flake, and a test running longer than 5 minutes fails.
[profile.ci]
test-threads = "num-cpus"
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# Written to <target-dir>/nextest/ci/junit.xml; the jobs copy it into
# runtime-evidence/.
[profile.ci.junit]
path = "junit.xml"

[[profile.ci.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
run-wrapper = 'data-dir'

[[profile.ci.scripts]]
platform = 'cfg(windows)'
filter = 'all()'
run-wrapper = 'data-dir-windows'
