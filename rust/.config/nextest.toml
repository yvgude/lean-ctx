# cargo-nextest configuration (workspace root: rust/).
#
# Agents: cargo nextest run -p lean-ctx-engine --lib --locked
# CI:     cargo nextest run --profile ci ...
#
# Why nextest for the lib suites: nearly every engine test takes a process-global
# test lock (test_env_lock / isolated_data_dir, #[serial], TestPolicyOverride),
# so libtest threads queue behind each other (engine lib: ~708 s wall, < 1 core).
# nextest runs one process per test, so those in-process locks only serialize
# within a test (engine lib: ~150 s). The integration binaries are a different
# trade-off (see .github/workflows/ci.yml, #1206).
experimental = ["wrapper-scripts"]

[profile.default]
# Leave headroom on shared build hosts; override with --test-threads.
test-threads = -4
# Flakes must surface, not be masked: no profile retries.
retries = 0
# Report a test after 60 s, kill it after 5 periods (300 s). The slowest
# engine test today is core::cache::tests::concurrent_cache_hits_are_lossless
# (130-175 s at 16 threads: 16k durable event appends); it alone sets the
# suite's wall time.
slow-timeout = { period = "60s", terminate-after = 5 }
leak-timeout = "500ms"
fail-fast = false

[scripts.wrapper.data-dir]
command = { command-line = ".config/nextest-data-dir.sh", relative-to = "workspace-root" }

# The same wrapper for Windows hosts (GitHub's Windows job), as a batch file.
[scripts.wrapper.data-dir-windows]
command = { command-line = ".config/nextest-data-dir.cmd", relative-to = "workspace-root" }

# One empty LEAN_CTX_DATA_DIR per test process (see nextest-data-dir.sh/.cmd).
[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
run-wrapper = 'data-dir'

[[profile.default.scripts]]
platform = 'cfg(windows)'
filter = 'all()'
run-wrapper = 'data-dir-windows'

# Tests that share state outside the per-test data dir (fixed ports, fixed
# paths, cross-test ordering) go into a max-threads = 1 group here:
#   [test-groups]
#   serial-external = { max-threads = 1 }
#   [[profile.default.overrides]]
#   filter = 'test(/^suite::name::/)'
#   test-group = 'serial-external'
# These lean-ctx-server integration modules keep `#[serial]` tests on one
# fixed temp directory; one process per test would race on it.
[test-groups]
serial-external = { max-threads = 1 }

# Both are modules of the crate's one integration binary `server`
# (tests/main.rs, 5!214).
[[profile.default.overrides]]
filter = 'package(lean-ctx-server) & binary(server) & (test(/^workflow_done_scenarios::/) | test(/^bazsi_reported_scenarios::/))'
test-group = 'serial-external'

# CI (ci/gitlab-ci.yml v4-runtime and mr-quick; GitHub CI). Owner 08.11.:
# one process per test on every CPU the job's cgroup grants (the job caps
# CPUs, CARGO_BUILD_JOBS caps the compile), every failure reported, no retry
# that could hide a flake, and a test running longer than 5 minutes fails.
[profile.ci]
test-threads = "num-cpus"
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# Written to <target-dir>/nextest/ci/junit.xml; the jobs copy it into
# runtime-evidence/.
[profile.ci.junit]
path = "junit.xml"

# Slowest first: nextest starts higher-priority tests before the rest, so a
# 10-30 s test no longer starts late and alone sets the wall time. Durations
# from CI (the job cgroup grants 6 CPUs, so 6 test threads); list tests of
# >= 10 s by exact name.
[[profile.ci.overrides]]
filter = '''
    (package(lean-ctx-engine) & test(=core::cache::tests::concurrent_cache_hits_are_lossless))
  | (package(lean-ctx-hive) & test(=sync::driver::tests::a_clone_before_the_snapshot_rebuild_folds_the_purge))
  | (package(lean-ctx-engine) & binary(gateway_postprocess_e2e) & test(=proxy_redacts_secrets_before_postprocessing))
  | (package(lean-ctx) & binary(main) & test(=suite::cli_characterization::overview_exits_cleanly))
  | (package(lean-ctx-syntax) & test(=deep_queries::tests::deeply_nested_source_does_not_overflow))
'''
priority = 100

[[profile.ci.overrides]]
filter = '''
    (package(lean-ctx) & binary(main) & (
        test(=suite::hive_connector_cli::the_relay_announces_a_remote_worker_so_its_role_gated_claim_succeeds)
      | test(=suite::lock_contention_hardening::bounded_lock_respects_adaptive_timeout_in_degraded)
      | test(=suite::hive_connector_cli::after_an_hive_restart_the_relay_says_hello_again_within_seconds)
      | test(=suite::hive_fake_wire_conformance::the_engine_maps_only_contract_error_reasons)
      | test(/^suite::(lock_contention_hardening|io_health_scenarios)::bounded_(read|write)_/)))
  | (package(lean-ctx-engine) & (
        test(=core::reference_store::tests::reference_pool_enforces_entry_and_aggregate_byte_budgets)
      | test(=core::knowledge::tests::a_store_over_eight_mib_stays_writable_and_recallable)
      | test(=core::context_ledger::persistence::tests::corrupt_or_locked_ledger_is_not_replaced)))
  | (package(lean-ctx) & test(=http_server::cancellation_tests::outer_rest_timeout_preserves_mcp_execution))
  | (package(lean-ctx) & binary(integration)
      & test(=oneshot_semantic_terminates::oneshot_semantic_search_and_compose_answer_on_a_real_sized_project))
  | (package(lean-ctx-hive) & test(=consent::web::tests::no_answer_within_ten_minutes_times_out_and_stays_pending))
  | (package(lean-ctx-server) & test(=tools::registered::ctx_read::tests::contended_cache_lock_degrades_to_uncached_read))
'''
priority = 50

[[profile.ci.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
run-wrapper = 'data-dir'

[[profile.ci.scripts]]
platform = 'cfg(windows)'
filter = 'all()'
run-wrapper = 'data-dir-windows'
