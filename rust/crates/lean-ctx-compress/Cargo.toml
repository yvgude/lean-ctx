# SPDX-License-Identifier: Apache-2.0
[package]
name = "lean-ctx-compress"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic text compressors (Markdown, JSON, CSV/TSV, YAML, HTML) for the LeanCTX Engine."
repository = "https://github.com/yvgude/lean-ctx"
homepage = "https://leanctx.com"
readme = "README.md"
keywords = ["lean-ctx", "llm", "tokens", "compression", "markdown"]
categories = ["text-processing", "development-tools"]
publish = true

[dependencies]
lean-ctx-patterns = { path = "../lean-ctx-patterns", version = "0.1.0" }
regex = "1.12"
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
similar = "3.1"
yaml_serde = "0.10.4"

# Same lint policy as the engine crate the code came from.
[lints.rust]
unreachable_pub = "warn"
# CI coverage (cargo-tarpaulin) injects `--cfg tarpaulin`; declare it to avoid
# `-D unexpected_cfgs` failures when using `cfg_attr(tarpaulin, ...)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Track unwrap reduction progress. Target: deny once count < 100.
# Current: ~4480 violations. See #1383.
unwrap_used = "warn"

# --- Style preferences (not quality issues) ---
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
# `assert!(x.is_empty())` is the idiom of this codebase (clippy 1.99+ lint;
# older clippy reports it as unknown, which `-D warnings` does not fail on).
assert_is_empty = "allow"
unreadable_literal = "allow"

# --- Documentation: covered by separate doc-coverage tooling ---
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# --- Casts: intentional numeric conversions for token counting, stats, sizing ---
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"

# --- Performance: format_push_string would require 276 refactors for minimal gain ---
format_push_string = "allow"

# --- Struct design: Config/StatsStore legitimately use many bools ---
struct_excessive_bools = "allow"

# --- Float: intentional comparisons in stats/benchmarks ---
float_cmp = "allow"

# --- Style: constants placed near usage for readability ---
items_after_statements = "allow"

# --- Pedantic bulk allows: ~226 violations from M14 audit (#1393) ---
too_many_lines = "allow"
struct_field_names = "allow"
enum_variant_names = "allow"
unnecessary_wraps = "allow"
default_trait_access = "allow"
unused_self = "allow"
map_unwrap_or = "allow"
needless_borrow = "allow"
collapsible_if = "allow"
useless_conversion = "allow"
manual_pattern_char_comparison = "allow"
empty_line_after_doc_comments = "allow"

# --- Underscore bindings: intentionally named for clarity then used ---
used_underscore_binding = "allow"
no_effect_underscore_binding = "allow"

# --- Micro-optimization: &bool vs bool, readability preferred ---
trivially_copy_pass_by_ref = "allow"

# --- HashMap: we always use default hasher ---
implicit_hasher = "allow"
