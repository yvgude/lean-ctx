[package]
name = "lean-ctx-protocol"
version = "0.8.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Open wire contracts for lean-ctx: events, observations, assignments, evidence gaps."
repository = "https://github.com/yvgude/lean-ctx"
# No test binary of its own: tests/main.rs holds the contract tests as modules
# and compiles into the unit-test binary (end of src/lib.rs).
autotests = false

[dependencies]
lean-ctx-time = { path = "../lean-ctx-time", version = "0.1.0" }
base64 = "0.22"
chacha20poly1305 = "0.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
# Cloud golden fixtures carry real signatures from fixed test-only keys
# (base64 for them comes from [dependencies]).
ed25519-dalek = "2.2"
hmac = "0.13"
