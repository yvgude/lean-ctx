# SPDX-License-Identifier: Apache-2.0
[package]
name = "lean-ctx-tasks"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Local project tasks of LeanCTX | OSS: the Hive task model and state machine, kept per project on this machine."
repository = "https://github.com/yvgude/lean-ctx"

# A leaf crate: it never depends on `lean-ctx`. The connector's adapter
# (lean-ctx-hive `tasks::local`) picks the store directory, posts the bus
# notices and routes linked projects to Hive (see rust/CRATE_MAP.md).
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fs2 = "0.4"
lean-ctx-fs = { path = "../lean-ctx-fs", version = "0.2.0" }
lean-ctx-protocol = { path = "../lean-ctx-protocol", version = "0.7.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
assert_is_empty = "allow"
unnecessary_wraps = "allow"
