# SPDX-License-Identifier: Apache-2.0
# The published `lean-ctx` crate: the CLI/MCP binary on top of the Engine
# library (package lean-ctx-engine, lib `lean_ctx`). Crates split upward out of
# the Engine sit between the two. The Engine is published first.
[package]
name = "lean-ctx"
version = "3.12.2"
edition = "2024"
autobins = false
description = "LeanCTX | OSS: the open-source runtime for the Context Gateway for AI agents. CLI, MCP server, and supported proxy integrations."
license = "Apache-2.0"
repository = "https://github.com/yvgude/lean-ctx"
homepage = "https://leanctx.com"
readme = "../../README.md"
keywords = ["context-gateway", "mcp", "llm", "ai-agents", "context"]
categories = ["command-line-utilities", "development-tools"]
# The integration tests read the Engine's tree (rust/): they cannot run from
# the published package.
exclude = ["tests/"]

[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"

[lib]
name = "lean_ctx_cli"
path = "src/lib.rs"

[[bin]]
name = "lean-ctx"
path = "src/main.rs"
# rustdoc would write the binary to doc/lean_ctx/ as well, colliding with the
# Engine library (lib name lean_ctx); the binary has no public API to document.
doc = false

# Same feature set as the Engine; each feature maps onto the Engine's feature
# of the same name, so `--features`/`--no-default-features` keep their meaning
# for `cargo install lean-ctx` and workspace builds.
[features]
default = [
  "tree-sitter",
  "embeddings",
  "http-server",
  "shape-xlat",
  "secure-update",
  "jemalloc",
  "qdrant",
  "pgvector",
  "wasm",
]
enterprise = ["lean-ctx-engine/enterprise", "lean-ctx-proxy/enterprise"]
# The binary exports jemalloc's options (`_rjem_malloc_conf`); its test reads
# them back through tikv-jemalloc-ctl.
jemalloc = ["lean-ctx-engine/jemalloc", "dep:tikv-jemalloc-ctl"]
dev-tools = ["lean-ctx-engine/dev-tools"]
no-jail = ["lean-ctx-hooks/no-jail", "lean-ctx-server/no-jail", "lean-ctx-engine/no-jail"]
onnx = ["lean-ctx-engine/onnx"]
embeddings = ["lean-ctx-server/embeddings", "lean-ctx-engine/embeddings"]
ort-cuda = ["lean-ctx-engine/ort-cuda"]
ort-webgpu = ["lean-ctx-engine/ort-webgpu"]
ort-rocm = ["lean-ctx-engine/ort-rocm"]
ort-directml = ["lean-ctx-engine/ort-directml"]
ort-coreml = ["lean-ctx-engine/ort-coreml"]
http-server = ["lean-ctx-hive/http-server", "lean-ctx-server/http-server", "lean-ctx-engine/http-server", "lean-ctx-proxy/http-server", "dep:axum", "dep:rustls"]
qdrant = ["lean-ctx-engine/qdrant"]
pgvector = ["lean-ctx-engine/pgvector"]
shape-xlat = ["lean-ctx-engine/shape-xlat", "lean-ctx-proxy/shape-xlat"]
secure-update = ["lean-ctx-engine/secure-update", "dep:rustls"]
tree-sitter = ["lean-ctx-hooks/tree-sitter", "lean-ctx-server/tree-sitter", "lean-ctx-engine/tree-sitter", "dep:tree-sitter", "dep:tree-sitter-bash"]
grammars-long-tail = ["lean-ctx-engine/grammars-long-tail"]
grammar-ocaml = ["lean-ctx-engine/grammar-ocaml"]
grammar-haskell = ["lean-ctx-engine/grammar-haskell"]
grammar-julia = ["lean-ctx-engine/grammar-julia"]
wasm = ["lean-ctx-engine/wasm"]

[dependencies]
# Used directly by the composition root moved out of the Engine.
md-5 = "0.11"
lean-ctx-doc = { path = "../lean-ctx-doc", version = "0.1.0" }
lean-ctx-ocla = { path = "../lean-ctx-ocla", version = "5.0.0" }
lean-ctx-protocol = { path = "../lean-ctx-protocol", version = "0.5.0" }
rmcp = { version = "3", features = [
  "server",
  "client",
  "transport-io",
  "transport-streamable-http-server",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  # OAuth 2.1 for HTTP MCP servers that require a browser login (#1391):
  # discovery, dynamic client registration, PKCE, code exchange, refresh.
  "auth",
  # Form elicitation: ctx_shell asks the user to approve a command the shell
  # allowlist does not name (server/shell_approval.rs).
  "elicitation",
] }
http = "1.4"
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "net",
  "sync",
  "time",
  "signal",
  "process",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
clap = { version = "4.5", features = ["derive"] }
subtle = "2.6"
anyhow = "1.0"
regex = "1.12"
walkdir = "2.5"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
futures = "0.3"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
toml_edit = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
tree-sitter = { version = "0.26", optional = true }
ureq = { version = "3.3", features = ["platform-verifier"] }
zip = "9.0.4"
tree-sitter-bash = { version = "0.25", optional = true }
axum = { version = "0.8", optional = true, features = ["ws"] }
tower = "0.5"
rustls = { version = "0.23.45", optional = true }
base64 = "0.22"
hex = "0.4"
sha2 = "0.11"
glob = "0.3"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
zeroize = "1"
getrandom = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3.27"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "json",
  "cookies",
] }
libc = "0.2"
blake3 = "1.8"
rayon = "1.12"
fs2 = "0.4"
gethostname = "1.1"
lean-ctx-engine = { path = "../..", version = "=3.12.2", default-features = false }
lean-ctx-hooks = { path = "../lean-ctx-hooks", version = "=3.12.2", default-features = false }
lean-ctx-hive = { path = "../lean-ctx-hive", version = "=3.12.2", default-features = false }
lean-ctx-server = { path = "../lean-ctx-server", version = "=3.12.2", default-features = false }
lean-ctx-proxy = { path = "../lean-ctx-proxy", version = "=3.12.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(not(windows), not(target_env = "musl")))'.dependencies]
tikv-jemalloc-ctl = { version = "0.7", optional = true, features = ["stats"] }

# Used by the integration tests (tests/ and the merged suite in rust/tests/).
[dev-dependencies]
filetime = "0.2"
tokio-rustls = "0.26"
# The Engine's test helpers for this crate's unit tests (see core::test_mode).
lean-ctx-engine = { path = "../..", version = "=3.12.2", default-features = false, features = ["test-support"] }
# The server's fixtures (isolation canary, work-graph delivery API) for this crate's tests.
lean-ctx-server = { path = "../lean-ctx-server", version = "=3.12.2", default-features = false, features = ["test-support"] }
lean-ctx-ocla = { path = "../lean-ctx-ocla" }
lean-ctx-protocol = { path = "../lean-ctx-protocol" }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
insta = "1.48"
jsonschema = { version = "0.46", default-features = false }
proptest = "1.11"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "json",
  "cookies",
] }
rmcp = { version = "3", features = [
  "server",
  "client",
  "transport-io",
  "transport-child-process",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
serial_test = "3.5"
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "net",
  "sync",
  "time",
  "signal",
  "process",
] }
toml = "1.1"
tower = "0.5"
ureq = "3.3"
urlencoding = "2.1"
walkdir = "2.5"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemServices",
  "Win32_System_IO",
] }
