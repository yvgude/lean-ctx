[[deprecation]]
id = "config-auto-mode-learning"
surface = "config"
subject = "auto_mode_learning (env LEAN_CTX_AUTO_MODE_LEARNING)"
announced_in = "3.13.0"
earliest_removal = "3.15.0"
replacement = ""
note = "The learned auto-mode signals (mode predictor, mode bandit, adaptive mode policy) are retired; `auto` is always the deterministic capability-guard and size/task cascade. The key and the env var are accepted and have no effect."

[[deprecation]]
id = "config-env-stochastic"
surface = "config"
subject = "env LEAN_CTX_STOCHASTIC"
announced_in = "3.13.0"
earliest_removal = "3.15.0"
replacement = ""
note = "It enabled Thompson sampling in the threshold and mode bandits, which are retired; decisions are always deterministic. The env var is ignored."

