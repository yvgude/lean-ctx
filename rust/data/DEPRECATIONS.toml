subject = "lean-ctx serve --auth-token <token>"
announced_in = "3.13.0"
earliest_removal = "3.15.0"
replacement = "lean-ctx serve --auth-token-file <path> (or LEAN_CTX_HTTP_TOKEN / LEAN_CTX_HTTP_TOKEN_FILE)"
note = "The token on the command line is visible in the process list. The flag still works and warns on stderr."

[[deprecation]]
id = "mcp-ctx-agent-poll-events-aliases"
