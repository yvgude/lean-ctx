# Vendors' own APIs: never part of the subscription, opt-in only on the engine
# (`[proxy] allow_vendor_direct_cn`), void when the org policy sets vendor_direct_cn = false.
# host_country is where the vendor processes the requests.
[[direct]]
vendor = "DeepSeek"
hosts = ["api.deepseek.com"]
host_country = "CN"

[[direct]]
