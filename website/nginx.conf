server {
    listen 80;
    server_name leanctx.tech www.leanctx.tech www.leanctx.com lean-ctx.pounce.ch;
    return 301 https://leanctx.com$request_uri;
}

server {
    listen 80;
    server_name leanctx.com _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/ld+json;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/stats {
        proxy_pass http://leanctx-stats-api:3099/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=30";
        add_header Access-Control-Allow-Origin "*";
    }

    # Wrapped permalinks (VL-3): leanctx.com/w/<id> is now a static site page that shares the
    # leaderboard design. Opted-in leaderboard cards are pre-rendered (correct per-card OG); any
    # other id falls back to the /w/view/ shell, which fills in client-side from the API. The
    # og:image still points at api.leanctx.com/api/wrapped/<id>/card.png. ^~ wins over the
    # static-asset regex locations below; HTML stays revalidated like every other page.
    location ^~ /w/ {
        try_files $uri $uri/ /w/view/index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /leaderboard {
        proxy_pass http://lean-ctx-cloud-api:8088/leaderboard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /install.sh {
        return 302 https://raw.githubusercontent.com/yvgude/lean-ctx/main/install.sh;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|svg|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.html$ {
        expires 0;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(json|xml|txt)$ {
        expires 12h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap-index.xml {
        expires 24h;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /robots.txt {
        expires 24h;
        add_header Cache-Control "public";
    }

    location /.well-known/ {
        expires 24h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /llms.txt {
        expires 12h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /llms-full.txt {
        expires 12h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /ai.txt {
        expires 12h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    error_page 404 /404.html;
}
