server {
    listen 80;
    server_name leanctx.tech www.leanctx.tech www.leanctx.com lean-ctx.pounce.ch;
    return 301 https://leanctx.com$request_uri;
}

server {
    listen 80;
    server_name leanctx.com _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/ld+json;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /install.sh {
        return 302 https://raw.githubusercontent.com/yvgude/lean-ctx/main/install.sh;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|svg|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(json|xml|txt)$ {
        expires 12h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap-index.xml {
        expires 24h;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /robots.txt {
        expires 24h;
        add_header Cache-Control "public";
    }

    location /.well-known/ {
        expires 24h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /llms.txt {
        expires 12h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /llms-full.txt {
        expires 12h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    error_page 404 /404.html;
}
