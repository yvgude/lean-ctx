<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="titleGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080C1A"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Logo / Title -->
  <text x="600" y="180" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="96" font-weight="700" fill="url(#textGrad)" letter-spacing="-3">lean-ctx</text>
  <text x="600" y="180" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="96" font-weight="700" fill="#34d399" letter-spacing="-3" opacity="0.15" filter="url(#titleGlow)">lean-ctx</text>

  <!-- Tagline -->
  <text x="600" y="230" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="1">The Context Layer for AI Coding</text>

  <!-- Accent divider -->
  <rect x="520" y="260" width="160" height="2" rx="1" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Three metric cards -->
  <!-- Card 1: Tools -->
  <g filter="url(#cardShadow)">
    <rect x="135" y="300" width="260" height="110" rx="16" fill="#0F1629" opacity="0.9"/>
    <rect x="135" y="300" width="260" height="110" rx="16" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
    <text x="265" y="348" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#34d399">46</text>
    <text x="265" y="385" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">MCP Tools</text>
  </g>

  <!-- Card 2: Savings -->
  <g filter="url(#cardShadow)">
    <rect x="470" y="300" width="260" height="110" rx="16" fill="#0F1629" opacity="0.9"/>
    <rect x="470" y="300" width="260" height="110" rx="16" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
    <text x="600" y="348" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#3b82f6">88%</text>
    <text x="600" y="385" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Token Savings</text>
  </g>

  <!-- Card 3: Editors -->
  <g filter="url(#cardShadow)">
    <rect x="805" y="300" width="260" height="110" rx="16" fill="#0F1629" opacity="0.9"/>
    <rect x="805" y="300" width="260" height="110" rx="16" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
    <text x="935" y="348" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#8b5cf6">21</text>
    <text x="935" y="385" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">AI Editors</text>
  </g>

  <!-- Secondary stats row -->
  <text x="600" y="465" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" fill="#64748b">
    <tspan fill="#34d399">Rust</tspan>  ·  <tspan fill="#94a3b8">Single Binary</tspan>  ·  <tspan fill="#34d399">Zero Telemetry</tspan>  ·  <tspan fill="#94a3b8">MIT Licensed</tspan>  ·  <tspan fill="#34d399">18 Languages</tspan>
  </text>

  <!-- Install command -->
  <rect x="350" y="500" width="500" height="38" rx="8" fill="#0F1629" stroke="#1e293b" stroke-width="1"/>
  <text x="370" y="525" font-family="'JetBrains Mono', monospace" font-size="14" fill="#34d399">$</text>
  <text x="390" y="525" font-family="'JetBrains Mono', monospace" font-size="14" fill="#e2e8f0">curl -fsSL leanctx.com/install.sh | sh</text>

  <!-- URL bottom -->
  <text x="600" y="590" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" fill="#34d399" opacity="0.8">leanctx.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accentGrad)"/>
</svg>
